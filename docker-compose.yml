services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hesabpak
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    ports:
      - '8881:8000'
    environment:
      DATABASE_URL: "postgresql+psycopg2://postgres:postgres@db:5432/hesabpak"
      DEMO_SEED: "true"
      SCHEDULER_ENABLED: "true"
      BACKEND_PORT: "8881"
      DEVELOPER_USER: "developer"
      DEVELOPER_PASS: "88808881"
      DEVELOPER_MOBILE: "88808881"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/hello"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 120s

  frontend:
    build:
      context: ./frontend
    ports:
      - '8880:3000'
    depends_on:
      - backend
    environment:
      FRONTEND_PORT: "8880"
      BACKEND_PORT: "8881"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  db_data:
