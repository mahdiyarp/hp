server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Performance & transport
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  # Do not gzip fonts (WOFF/WOFF2 are already compressed); avoid OTS parse issues
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
  gzip_disable "msie6";
  etag on;

  # Security-oriented defaults (non-breaking)
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer-when-downgrade" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  # Permissions-Policy kept minimal to avoid breaking features
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  client_max_body_size 10m;

  # SPA entrypoint - ensure index.html is served with correct headers (avoid download)
  location / {
    try_files $uri $uri/ /index.html;
    # Make sure text/html has charset and not marked as attachment
    types { text/html html; }
    default_type text/html;
    add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate' always;
    add_header Pragma 'no-cache' always;
    add_header Expires '0' always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  }

  # Long cache for hashed static assets generated by Vite
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  }

  # Serve fonts directly and allow cross-origin access (no gzip)
  location ~* \.(?:woff2|woff|ttf|otf|eot|svg)$ {
    try_files $uri =404;
    access_log off;
    gzip off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Origin, Accept, Content-Type" always;
    # ensure correct content-type for modern webfonts
    types { application/font-woff2 woff2; font/woff woff; font/ttf ttf; }
    default_type "application/octet-stream";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  }

  # Serve other static assets with long cache
  # Prefer no-cache for JS bundles to avoid serving stale code after deploy
  location ~* \.js$ {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  }

  # Other static assets can be cached long
  location ~* \.(?:css|png|jpg|jpeg|gif|ico|json)$ {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  }

  # Proxy API to backend service
  location /api/ {
    # Proxy API requests to backend service on compose network
    # Preserve incoming path to backend root
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass http://backend:8000;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  }
}

