version: '3.9'

services:
  db:
    image: postgres:15-alpine
    container_name: hesabpak_db_prod
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-CHANGE_ME_IN_PRODUCTION}
      POSTGRES_DB: ${DB_NAME:-hesabpak}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.utf8"
    volumes:
      - db_data_prod:/var/lib/postgresql/data
      - ./backend/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./backups:/backups
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - hesabpak-prod-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: hesabpak_redis_prod
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - hesabpak-prod-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.production
    image: hesabpak_backend:1.0.0
    container_name: hesabpak_backend_prod
    ports:
      - '${BACKEND_PORT:-8000}:8000'
    env_file:
      - ./backend/.env.production
    environment:
      DATABASE_URL: "postgresql+psycopg2://${DB_USER:-postgres}:${DB_PASSWORD:-CHANGE_ME_IN_PRODUCTION}@db:5432/${DB_NAME:-hesabpak}"
      REDIS_URL: "redis://redis:6379/0"
      SECRET_KEY: ${SECRET_KEY:-CHANGE_ME_PLEASE}
      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,https://yourdomain.com}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY}
      BACKUP_RETENTION_DAYS: "30"
    volumes:
      - ./backend/exports:/app/exports
      - ./backend/logs:/app/logs
      - ./backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hesabpak-prod-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  person_sync_consumer:
    image: hesabpak_backend:1.0.0
    container_name: hesabpak_sync_prod
    working_dir: /app
    env_file:
      - ./backend/.env.production
    environment:
      DATABASE_URL: "postgresql+psycopg2://${DB_USER:-postgres}:${DB_PASSWORD:-CHANGE_ME_IN_PRODUCTION}@db:5432/${DB_NAME:-hesabpak}"
      REDIS_URL: "redis://redis:6379/0"
    command: ["python", "-u", "./scripts/person_sync_consumer.py"]
    depends_on:
      - backend
      - redis
    restart: unless-stopped
    networks:
      - hesabpak-prod-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backup_scheduler:
    image: hesabpak_backend:1.0.0
    container_name: hesabpak_backup_prod
    working_dir: /app
    env_file:
      - ./backend/.env.production
    environment:
      DATABASE_URL: "postgresql+psycopg2://${DB_USER:-postgres}:${DB_PASSWORD:-CHANGE_ME_IN_PRODUCTION}@db:5432/${DB_NAME:-hesabpak}"
      BACKUP_RETENTION_DAYS: "30"
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY}
    volumes:
      - ./backups:/app/backups
    command: ["python", "-u", "./scripts/backup_scheduler.py"]
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - hesabpak-prod-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
    image: hesabpak_frontend:1.0.0
    container_name: hesabpak_frontend_prod
    ports:
      - '${FRONTEND_PORT:-3000}:80'
    environment:
      BACKEND_API_URL: ${BACKEND_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - hesabpak-prod-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: hesabpak_nginx_prod
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
      - ./infra/nginx/dhparam.pem:/etc/nginx/dhparam.pem:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - hesabpak-prod-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  db_data_prod:
  redis_data_prod:

networks:
  hesabpak-prod-network:
    driver: bridge
