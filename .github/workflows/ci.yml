name: Backend CI

on:
  push:
    branches: [ main, master, develop, 'copilot/**' ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-tests:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: 'test'
      DATABASE_URL: 'sqlite:///./ci_test.db'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          if [ -f backend/requirements-dev.txt ]; then pip install -r backend/requirements-dev.txt; fi
          pip install pytest

      - name: Alembic import check
        working-directory: backend
        run: |
          alembic -c alembic.ini current || true

      - name: Run pytest (repo root)
        run: |
          pytest -q
