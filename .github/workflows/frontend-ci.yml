name: Frontend CI

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'

jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (Vitest)
        run: npm run -s test

      - name: Build
        run: npm run -s build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  e2e:
    runs-on: ubuntu-latest
    needs: unit-and-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Start backend (uvicorn)
        working-directory: backend
        env:
          DEV_FEATURES_ENABLED: 'true'
          ENVIRONMENT: 'test'
          DATABASE_URL: 'sqlite:///./ci_e2e.db'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt || true; fi
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../../uvicorn-e2e.log 2>&1 &
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then break; fi
            sleep 1
          done

      - name: Start preview server
        working-directory: frontend
        run: |
          nohup npm run -s preview -- --strictPort --port 3000 > ../preview.log 2>&1 &
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:3000 > /dev/null; then break; fi
            sleep 1
          done

      - name: Run E2E tests (Playwright)
        working-directory: frontend
        env:
          BASE_URL: http://127.0.0.1:3000
          BACKEND_URL: http://127.0.0.1:8000
        run: npm run -s test:e2e
