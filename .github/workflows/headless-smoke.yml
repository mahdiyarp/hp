name: Headless Smoke Test

on:
  push:
    branches:
      - copilot/sales-one-row-layout
      - main
      - master
  pull_request:
    branches:
      - '**'

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: |
          npm install -D playwright
          npx playwright install chromium

      - name: Start services
        shell: bash
        run: |
          docker compose -f docker-compose.yml up -d --build frontend backend db
          # Wait for frontend to be ready
          tries=0; until curl -sSf http://localhost:3000 >/dev/null 2>&1; do tries=$((tries+1)); if [ "$tries" -gt 60 ]; then echo "Frontend not ready"; exit 1; fi; sleep 2; done

      - name: Run headless smoke test
        env:
          URL: http://localhost:3000
        run: |
          node scripts/headless_test.js || exit 0

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: headless-smoke
          path: |
            workspace/logs/headless_console.log
            workspace/logs/headless_screenshot.png
