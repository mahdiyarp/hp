name: Copilot Scaffold CI

on:
  push:
    paths:
      - 'copilot/scaffold/**'
  pull_request:
    paths:
      - 'copilot/scaffold/**'

jobs:
  backend-tests:
    name: Backend tests (FastAPI scaffold)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Poetry
        run: pip install poetry

      - name: Install backend dependencies
        working-directory: copilot/scaffold/backend
        run: |
          poetry config virtualenvs.create false
          poetry install --no-interaction --no-ansi

      - name: Run backend tests
        working-directory: copilot/scaffold/backend
        run: pytest -q

  frontend-build:
    name: Frontend build (React + Vite scaffold)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend dependencies
        working-directory: copilot/scaffold/frontend
        run: npm ci

      - name: Build frontend
        working-directory: copilot/scaffold/frontend
        run: npm run build --if-present
