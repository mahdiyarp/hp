name: Backend Tests

on:
  push:
    branches: [ main, copilot/* ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then python -m pip install -r requirements-dev.txt; else python -m pip install -r requirements.txt; fi
          python -m pip install pytest-cov coverage

      - name: Run tests with coverage
        env:
          DATABASE_URL: sqlite:///:memory:
        run: |
          mkdir -p test-results coverage
          python -m pytest -q --junitxml=test-results/pytest.xml --cov=app --cov-report=xml:coverage/coverage.xml --cov-report=term-missing

      - name: Upload pytest cache (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-cache
          path: backend/.pytest_cache

      - name: Upload JUnit test results (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: backend/test-results/pytest.xml
          if-no-files-found: warn

      - name: Upload coverage report (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage/
          if-no-files-found: warn
