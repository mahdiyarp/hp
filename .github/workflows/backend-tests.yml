name: Backend Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: PyTest (FastAPI backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DEV_FEATURES_ENABLED: 'false'
      ENVIRONMENT: 'test'
      PYTHONPATH: '.'
      DATABASE_URL: 'sqlite:///./ci_test.db'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt || true; fi
          pip install uvicorn pytest

      - name: Start backend server
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -sS http://127.0.0.1:8000/health

      - name: Run tests
        run: pytest -q
name: Backend Tests

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Start API server
        env:
          DATABASE_URL: sqlite:///:memory:
          DEV_FEATURES_ENABLED: 'false'
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          sleep 3

      - name: Run tests
        env:
          # Tests set this internally, but we keep a safe default here too
          DATABASE_URL: sqlite:///:memory:
          API_BASE_URL: http://127.0.0.1:8000
        run: |
          unset http_proxy https_proxy all_proxy HTTP_PROXY HTTPS_PROXY ALL_PROXY || true
          export NO_PROXY=localhost,127.0.0.1
          python -m pytest -q
