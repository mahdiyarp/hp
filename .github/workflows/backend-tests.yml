name: Backend Tests

on:
  push:
    branches: [ main, copilot/* ]
  pull_request:
    branches: [ main ]

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Ruff version
        run: ruff --version

      - name: Lint backend with Ruff (non-blocking)
        run: ruff check backend --exit-zero

  tests:
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.10', '3.11', '3.12' ]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements-dev.txt', 'backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then python -m pip install -r requirements-dev.txt; else python -m pip install -r requirements.txt; fi
          python -m pip install pytest-cov coverage

      - name: Run tests with coverage (3.11 only)
        if: matrix.python-version == '3.11'
        env:
          DATABASE_URL: sqlite:///:memory:
        run: |
          mkdir -p test-results/${{ matrix.python-version }} coverage
          python -m pytest -q --junitxml=test-results/${{ matrix.python-version }}/pytest.xml --cov=app --cov-report=xml:coverage/coverage.xml --cov-report=term-missing

      - name: Run tests (no coverage)
        if: matrix.python-version != '3.11'
        env:
          DATABASE_URL: sqlite:///:memory:
        run: |
          mkdir -p test-results/${{ matrix.python-version }}
          python -m pytest -q --junitxml=test-results/${{ matrix.python-version }}/pytest.xml

      - name: Upload pytest cache (always)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pytest-cache-py${{ matrix.python-version }}
          path: backend/.pytest_cache

      - name: Upload JUnit test results (always)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: junit-results-py${{ matrix.python-version }}
          path: backend/test-results/${{ matrix.python-version }}/pytest.xml
          if-no-files-found: warn

      - name: Upload coverage report (always, 3.11 only)
        if: always() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-report
          path: backend/coverage/
          if-no-files-found: warn

      - name: Generate coverage summary (3.11 only)
        if: always() && matrix.python-version == '3.11'
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95
        with:
          filename: backend/coverage/coverage.xml
          badge: true
          format: markdown
          output: both
          indicators: true

      - name: Post coverage comment to PR (3.11 only)
        if: ${{ github.event_name == 'pull_request' && matrix.python-version == '3.11' }}
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405
        with:
          recreate: true
          path: code-coverage-results.md

      - name: Publish unit test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@34d7c956a59aed1bfebf31df77b8de55db9bbaaf
        with:
          files: |
            backend/test-results/${{ matrix.python-version }}/pytest.xml
          check_name: Unit Test Results (Python ${{ matrix.python-version }})
