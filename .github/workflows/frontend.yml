name: Frontend CI

on:
  push:
    branches: [ main, master, develop, dev, staging, copilot/** ]
  pull_request:
    branches: [ main, master, develop, dev, staging ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Clean fonts (remove corrupt woff2)
        run: npm run clean-fonts || true

      - name: Typecheck
        run: npm run typecheck

      - name: Lint Nginx security headers config
        run: npm run check:headers-config

      - name: Unit/Smoke tests (Vitest)
        run: npm run test -- --reporter=verbose

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: E2E tests (Playwright)
        env:
          VITE_BACKEND_URL: 'http://localhost:8000'
        run: |
          npx playwright install-deps || true
          npx xvfb-run -a npm run test:e2e

      - name: Build
        run: npm run build
